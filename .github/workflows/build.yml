name: Test-build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build_and_release:
    name: Build for tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: ${{ runner.os }}-pio-v4-${{ hashFiles('**/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-v4-

      - name: Install dependencies
        run: pip install requests esptool

      - name: Install PlatformIO Core
        run: |
          pip install platformio
          platformio update
          
          # Descarrega as dependências de forma limpa
          pio pkg install
          
          esp32_file="$HOME/.platformio/packages/framework-arduinoespressif32/tools/sdk/esp32/lib/libnet80211.a"
          esp32s3_file="$HOME/.platformio/packages/framework-arduinoespressif32/tools/sdk/esp32s3/lib/libnet80211.a"
          
          esp32_file_temp="$HOME/.platformio/packages/framework-arduinoespressif32/tools/sdk/esp32/lib/libnet80211_temp.a"
          esp32s3_file_temp="$HOME/.platformio/packages/framework-arduinoespressif32/tools/sdk/esp32s3/lib/libnet80211_temp.a"
          
          toolchain_esp32="$HOME/.platformio/packages/toolchain-xtensa-esp32/xtensa-esp32-elf/bin/objcopy"
          toolchain_esp32s3="$HOME/.platformio/packages/toolchain-xtensa-esp32s3/xtensa-esp32s3-elf/bin/objcopy"
          
          if [ ! -f "$toolchain_esp32" ]; then toolchain_esp32=$(find $HOME/.platformio/packages/ -name "xtensa-esp32-elf-objcopy" | head -n 1); fi
          if [ ! -f "$toolchain_esp32s3" ]; then toolchain_esp32s3=$(find $HOME/.platformio/packages/ -name "xtensa-esp32s3-elf-objcopy" | head -n 1); fi
          
          if [ -z "$toolchain_esp32" ]; then toolchain_esp32="objcopy"; fi
          if [ -z "$toolchain_esp32s3" ]; then toolchain_esp32s3="objcopy"; fi

          if [[ -f "$esp32_file" && -f "$esp32s3_file" ]]; then
              $toolchain_esp32 --weaken-symbol=ieee80211_raw_frame_sanity_check "$esp32_file" "$esp32_file_temp"
              mv "$esp32_file" "${esp32_file}.old"
              mv "$esp32_file_temp" "$esp32_file"
          
              $toolchain_esp32s3 --weaken-symbol=ieee80211_raw_frame_sanity_check "$esp32s3_file" "$esp32s3_file_temp"
              mv "$esp32s3_file" "${esp32s3_file}.old"
              mv "$esp32s3_file_temp" "$esp32s3_file"
              echo "Patch aplicado com sucesso."
          else
              echo "Aviso: Arquivos base prontos para compilação."
          fi

      - name: Build Project
        run: |
          platformio run

      - name: Process, Merge and Separate Binaries
        run: |
          mkdir -p build_outputs
          version="v0.0.${{ github.run_number }}"
          
          # Caminho padrão do boot_app0.bin dentro do framework instalado
          boot_app0_src="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          
          for env_dir in .pio/build/*/; do
            if [ -d "$env_dir" ]; then
              env_name=$(basename "$env_dir")
              echo "----------------------------------------"
              echo "Processando arquivos para: $env_name"
              
              bootloader="$env_dir/bootloader.bin"
              partitions="$env_dir/partitions.bin"
              firmware="$env_dir/firmware.bin"
              
              if [[ -f "$bootloader" && -f "$partitions" && -f "$firmware" ]]; then
                # Identifica as configurações de memória da placa
                if [[ "$env_name" == *"s3"* || "$env_name" == *"cardputer"* ]]; then
                  chip="esp32s3"
                  offset="0x0000"
                  flash_size="8MB"
                elif [[ "$env_name" == *"cplus2"* ]]; then
                  chip="esp32"
                  offset="0x1000"
                  flash_size="8MB"
                else
                  chip="esp32"
                  offset="0x1000"
                  flash_size="4MB"
                fi
                
                # 1. Copia o Bootloader separado
                cp "$bootloader" "build_outputs/Bruce_${env_name}_${version}_bootloader.bin"
                
                # 2. Copia a Partition separado
                cp "$partitions" "build_outputs/Bruce_${env_name}_${version}_partitions.bin"
                
                # 3. Copia o boot_app0 (O arquivo "boot" / "otadata") se ele existir
                if [ -f "$boot_app0_src" ]; then
                  cp "$boot_app0_src" "build_outputs/Bruce_${env_name}_${version}_boot_app0.bin"
                  boot_app0_param="0xe000 $boot_app0_src"
                else
                  echo "Aviso: boot_app0.bin não encontrado no caminho padrão."
                  boot_app0_param=""
                fi
                
                # 4. Copia o Firmware principal separado
                cp "$firmware" "build_outputs/Bruce_${env_name}_${version}_firmware.bin"
                
                # 5. Cria e salva a versão mesclada (completa contendo todos os 4)
                echo "Mesclando todos os arquivos no binário unificado..."
                esptool.py --chip $chip merge_bin -o "$env_dir/release.bin" --flash_mode dio --flash_size $flash_size $offset "$bootloader" 0x8000 "$partitions" $boot_app0_param 0x10000 "$firmware"
                mv "$env_dir/release.bin" "build_outputs/Bruce_${env_name}_${version}_full_merged.bin"
                
                echo "Sucesso: Exportados todos os ficheiros para $env_name"
              else
                echo "Arquivos essenciais não encontrados para $env_name. Pulando..."
              fi
            fi
          done
          chmod -R +r build_outputs/
        if: github.event_name != 'pull_request'

      - name: Upload All Binaries (Unified Pack)
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-Firmwares-v0.0.${{ github.run_number }}
          path: build_outputs/
        if: github.event_name != 'pull_request'
        
