name: Test-build-WROOM-OLED

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build_and_release:
    name: Build ESP32 WROOM OLED Only
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO (Clean Key)
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: ${{ runner.os }}-pio-wroom-exclusive-v2-${{ hashFiles('**/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-wroom-exclusive-v2-

      - name: Force Variant and Board Fixes
        run: |
          mkdir -p boards
          cat << 'EOF' > boards/esp32-wroom-oled.json
          {
            "build": {
              "core": "esp32",
              "extra_flags": "-DARDUINO_ESP32_DEV",
              "f_cpu": "240000000L",
              "f_flash": "40000000L",
              "flash_mode": "dio",
              "mcu": "esp32",
              "variant": "esp32"
            },
            "connectivity": [
              "wifi",
              "bluetooth"
            ],
            "frameworks": [
              "arduino"
            ],
            "name": "ESP32 WROOM OLED",
            "upload": {
              "flash_size": "4MB",
              "maximum_ram_size": 327680,
              "maximum_size": 4194304,
              "require_upload_port": true,
              "speed": 921600
            },
            "vendor": "Espressif"
          }
          EOF

          # Modifica o platformio.ini para garantir que a variante correta seja incluída pelo compilador
          python -c "
          import os
          if os.path.exists('platformio.ini'):
              with open('platformio.ini', 'r') as f:
                  lines = f.readlines()
              new_lines = []
              for line in lines:
                  new_lines.append(line)
                  if '[env:esp32-wroom-oled]' in line:
                      new_lines.append('board_build.variant = esp32\n')
              with open('platformio.ini', 'w') as f:
                  f.writelines(new_lines)
              print('Sucesso: platformio.ini modificado para incluir caminhos base.')
          "

      - name: Install dependencies
        run: pip install requests esptool

      - name: Install PlatformIO Core
        run: |
          pip install platformio
          
          # Instala as dependências de forma limpa antes do patch de pacotes
          pio pkg install
          
          esp32_file="$HOME/.platformio/packages/framework-arduinoespressif32/tools/sdk/esp32/lib/libnet80211.a"
          esp32_file_temp="$HOME/.platformio/packages/framework-arduinoespressif32/tools/sdk/esp32/lib/libnet80211_temp.a"
          toolchain_esp32="$HOME/.platformio/packages/toolchain-xtensa-esp32/xtensa-esp32-elf/bin/objcopy"
          
          if [ ! -f "$toolchain_esp32" ]; then toolchain_esp32=$(find $HOME/.platformio/packages/ -name "xtensa-esp32-elf-objcopy" | head -n 1); fi
          if [ -z "$toolchain_esp32" ]; then toolchain_esp32="objcopy"; fi

          if [ -f "$esp32_file" ]; then
              $toolchain_esp32 --weaken-symbol=ieee80211_raw_frame_sanity_check "$esp32_file" "$esp32_file_temp"
              mv "$esp32_file" "${esp32_file}.old"
              mv "$esp32_file_temp" "$esp32_file"
              echo "Patch aplicado com sucesso."
          else
              echo "Aviso: Arquivos base prontos para compilação."
          fi

      - name: Build Project (WROOM OLED Only)
        run: |
          platformio run -e esp32-wroom-oled

      - name: Process, Merge and Separate Binaries
        run: |
          mkdir -p build_outputs
          version="v0.0.${{ github.run_number }}"
          env_dir=".pio/build/esp32-wroom-oled"
          
          echo "----------------------------------------"
          echo "Processando arquivos apenas para: esp32-wroom-oled"
          
          bootloader="$env_dir/bootloader.bin"
          partitions="$env_dir/partitions.bin"
          firmware="$env_dir/firmware.bin"
          boot_app0_src=$(find $HOME/.platformio/packages/ -name "boot_app0.bin" | head -n 1)
          
          if [[ -f "$bootloader" && -f "$partitions" && -f "$firmware" ]]; then
            # 1. Copia o Bootloader separado (Geralmente gravado em 0x1000)
            cp "$bootloader" "build_outputs/Bruce_esp32-wroom-oled_${version}_bootloader.bin"
            
            # 2. Copia as Partitions separado (Geralmente gravado em 0x8000)
            cp "$partitions" "build_outputs/Bruce_esp32-wroom-oled_${version}_partitions.bin"
            
            # 3. Copia o Firmware principal separado (Geralmente gravado em 0x10000)
            cp "$firmware" "build_outputs/Bruce_esp32-wroom-oled_${version}_firmware.bin"
            
            # 4. Copia o boot_app0 ("boot") separado e cria o arquivo unificado mesclado
            if [ -n "$boot_app0_src" ] && [ -f "$boot_app0_src" ]; then
              cp "$boot_app0_src" "build_outputs/Bruce_esp32-wroom-oled_${version}_boot_app0.bin"
              echo "Mesclando os 4 arquivos em um único binário full..."
              python -m esptool --chip esp32 merge_bin -o "build_outputs/Bruce_esp32-wroom-oled_${version}_full_merged.bin" --flash_mode dio --flash_size 4MB 0x1000 "$bootloader" 0x8000 "$partitions" 0xe000 "$boot_app0_src" 0x10000 "$firmware"
            else
              echo "Aviso: boot_app0.bin não encontrado. Mesclando sem ele..."
              python -m esptool --chip esp32 merge_bin -o "build_outputs/Bruce_esp32-wroom-oled_${version}_full_merged.bin" --flash_mode dio --flash_size 4MB 0x1000 "$bootloader" 0x8000 "$partitions" 0x10000 "$firmware"
            fi
            
            echo "Sucesso: Todos os arquivos individuais e unificados gerados na pasta de saída."
          else
            echo "Erro Crítico: Arquivos gerados não foram localizados."
            exit 1
          fi
          chmod -R +r build_outputs/
        if: github.event_name != 'pull_request'

      - name: Upload Binaries Artifacts Pack
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-ESP32-Wroom-OLED-${{ github.run_number }}
          path: build_outputs/
        if: github.event_name != 'pull_request'
        
