name: Build-WROOM-OLED-Definitivo

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build_and_release:
    name: Build ESP32 WROOM OLED Only
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO (Clean Ultimate Key)
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: ${{ runner.os }}-pio-wroom-ultimate-v4-${{ hashFiles('**/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-wroom-ultimate-v4-

      - name: Force Target Environment and Clean Board
        run: |
          cat << 'EOF' > fix_ini.py
          import os
          ini_path = 'platformio.ini'
          if os.path.exists(ini_path):
              with open(ini_path, 'r') as f:
                  lines = f.readlines()
              
              output = []
              inside_target = False
              
              for line in lines:
                  trimmed = line.strip()
                  if trimmed.startswith('[env:'):
                      if trimmed == '[env:esp32-wroom-oled]':
                          inside_target = True
                          output.append(line)
                          output.append("board = esp32dev\n")
                          output.append("board_build.variant = esp32\n")
                          continue
                      else:
                          inside_target = False
                  
                  if inside_target and '=' in trimmed:
                      key = trimmed.split('=')[0].strip()
                      if key in ['board', 'board_build.variant', 'board_build.f_cpu', 'board_build.f_flash', 'board_build.flash_mode']:
                          continue
                          
                  output.append(line)
                  
              with open(ini_path, 'w') as f:
                  f.writelines(output)
              print("Configuração platformio.ini higienizada com sucesso.")
          EOF
          python fix_ini.py

      - name: Install dependencies
        run: pip install requests esptool

      - name: Install PlatformIO Core & Patch Pinos Nativos
        run: |
          pip install platformio
          
          # Baixa as dependências e ferramentas do compilador do ESP32
          pio pkg install -e esp32-wroom-oled
          
          # -------------------------------------------------------------------
          # ESTRATÉGIA DEFINITIVA: Injeta o pins_arduino.h direto no core do ESP32
          # -------------------------------------------------------------------
          VARIANTS_DIR="$HOME/.platformio/packages/framework-arduinoespressif32/variants"
          CORES_DIR="$HOME/.platformio/packages/framework-arduinoespressif32/cores/esp32"
          
          if [ -d "$VARIANTS_DIR/esp32" ]; then
              echo "Injetando arquivos de pinagem nos diretórios do framework..."
              mkdir -p "$VARIANTS_DIR/esp32-wroom-oled"
              cp -rf "$VARIANTS_DIR/esp32/"* "$VARIANTS_DIR/esp32-wroom-oled/" || true
              cp -f "$VARIANTS_DIR/esp32/pins_arduino.h" "$CORES_DIR/" || true
              echo "Patch de pinagem aplicado com sucesso absoluto."
          fi
          # -------------------------------------------------------------------
          
          esp32_file="$HOME/.platformio/packages/framework-arduinoespressif32/tools/sdk/esp32/lib/libnet80211.a"
          esp32_file_temp="$HOME/.platformio/packages/framework-arduinoespressif32/tools/sdk/esp32/lib/libnet80211_temp.a"
          toolchain_esp32="$HOME/.platformio/packages/toolchain-xtensa-esp32/xtensa-esp32-elf/bin/objcopy"
          
          if [ ! -f "$toolchain_esp32" ]; then toolchain_esp32=$(find $HOME/.platformio/packages/ -name "xtensa-esp32-elf-objcopy" | head -n 1); fi
          if [ -z "$toolchain_esp32" ]; then toolchain_esp32="objcopy"; fi

          if [ -f "$esp32_file" ]; then
              $toolchain_esp32 --weaken-symbol=ieee80211_raw_frame_sanity_check "$esp32_file" "$esp32_file_temp"
              mv "$esp32_file" "${esp32_file}.old"
              mv "$esp32_file_temp" "$esp32_file"
              echo "Patch de rede aplicado com sucesso."
          fi

      - name: Build Project (WROOM OLED Only)
        env:
          PLATFORMIO_BUILD_FLAGS: "-I/home/runner/.platformio/packages/framework-arduinoespressif32/variants/esp32"
        run: |
          platformio run -e esp32-wroom-oled

      - name: Process, Merge and Separate Binaries
        run: |
          mkdir -p build_outputs
          version="v0.0.${{ github.run_number }}"
          env_dir=".pio/build/esp32-wroom-oled"
          
          echo "----------------------------------------"
          echo "Processando arquivos finais para o ESP32 WROOM OLED"
          
          bootloader="$env_dir/bootloader.bin"
          partitions="$env_dir/partitions.bin"
          firmware="$env_dir/firmware.bin"
          boot_app0_src=$(find $HOME/.platformio/packages/ -name "boot_app0.bin" | head -n 1)
          
          if [[ -f "$bootloader" && -f "$partitions" && -f "$firmware" ]]; then
            cp "$bootloader" "build_outputs/Bruce_esp32-wroom-oled_${version}_bootloader.bin"
            cp "$partitions" "build_outputs/Bruce_esp32-wroom-oled_${version}_partitions.bin"
            cp "$firmware" "build_outputs/Bruce_esp32-wroom-oled_${version}_firmware.bin"
            
            if [ -n "$boot_app0_src" ] && [ -f "$boot_app0_src" ]; then
              cp "$boot_app0_src" "build_outputs/Bruce_esp32-wroom-oled_${version}_boot_app0.bin"
              echo "Mesclando em um único binário consolidado..."
              python -m esptool --chip esp32 merge_bin -o "build_outputs/Bruce_esp32-wroom-oled_${version}_full_merged.bin" --flash_mode dio --flash_size 4MB 0x1000 "$bootloader" 0x8000 "$partitions" 0xe000 "$boot_app0_src" 0x10000 "$firmware"
            else
              echo "Mesclando sem o arquivo opcional boot_app0.bin..."
              python -m esptool --chip esp32 merge_bin -o "build_outputs/Bruce_esp32-wroom-oled_${version}_full_merged.bin" --flash_mode dio --flash_size 4MB 0x1000 "$bootloader" 0x8000 "$partitions" 0x10000 "$firmware"
            fi
            echo "Sucesso: Todos os arquivos .bin foram criados!"
          else
            echo "Erro Crítico: Arquivos compilados não foram localizados."
            exit 1
          fi
          chmod -R +r build_outputs/
        if: github.event_name != 'pull_request'

      - name: Upload Binaries Artifacts Pack
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-ESP32-Wroom-OLED-${{ github.run_number }}
          path: build_outputs/
        if: github.event_name != 'pull_request'
        
