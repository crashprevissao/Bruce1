; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-wroom-oled
;uncomment to not use global dirs to avoid possible conflicts
;platforms_dir = .pio/platforms
;packages_dir = .pio/packages
build_cache_dir = .pio/buildcache
cache_dir = .pio/cache

extra_configs =
  boards/*.ini
  boards/*/*.ini

[env]
platform = espressif32
platform_packages =
	framework-arduinoespressif32 @ https://github.com/bmorcelli/arduino-esp32/releases/download/2.0.17e/esp32-2.0.17e.zip
monitor_filters = esp32_exception_decoder, send_on_enter, colorize
framework = arduino
board_build.variants_dir = boards
board_build.filesystem = littlefs
build_src_flags =
	; warnings:
	-Wall
	-Wclobbered
	-Wempty-body
	-Wignored-qualifiers
	; -Wmissing-field-initializers
	; -Wsign-compare ; commented because it produces too much warnings, some of them are imposible to fix due to external deps
	-Wtype-limits
	-Wno-unused-label
	-Wno-comment
	-Wno-unused-variable
	; warnings end

; build_unflags = -Os ; uncomment this line and "-O2" for speed optimisations, but bigger size

build_flags =
	-DBRUCE_VERSION='"dev"'
	-DEEPROMSIZE=128
	-DLH=8
	-DLW=6
	; -O2
	-Wl,--print-memory-usage
	-Wl,--gc-sections
	-DGIT_COMMIT_HASH='"Homebrew"'
	-DSAFE_STACK_BUFFER_SIZE=4096
	-DFASTLED_RMT_BUILTIN_DRIVER=1 	; https://github.com/FastLED/FastLED/blob/67436be11fc3b7be611cdf9011f31c4f76817741/src/platforms/esp/32/rmt_4/idf4_clockless_rmt_esp32.h#L25-L33
									; This setting let RF Spectrum to work with LED interface with FastLED on ESP32-S3
	; rtl_433_ESP flags https://github.com/NorthernMan54/rtl_433_ESP/blob/main/example/OOK_Receiver/platformio.ini
	;-DOOK_MODULATION=true      ; False is FSK, True is OOK
	;-DRF_CC1101="CC1101"
	;-DRF_MODULE_GDO0=9   ; CC1101 pin GDO0
	;-DRF_MODULE_GDO2=14    ; CC1101 pin GDO2
	;-DRF_MODULE_GDO2=RADIOLIB_NC    ; CC1101 pin GDO2
	;-DRF_MODULE_INIT_STATUS=true

extra_scripts =
	pre:patch.py
	post:build.py

lib_deps =
	WireGuard-ESP32
	IRremoteESP8266
	Time
	LibSSH-ESP32
	bakadave/PCA9554
	https://github.com/bmorcelli/ESPping
	https://github.com/rennancockles/PN532
	https://github.com/rennancockles/MFRC522-I2C
	https://github.com/rennancockles/ESP-ChameleonUltra
	https://github.com/rennancockles/ESP-Amiibolink
	https://github.com/rennancockles/SimpleCLI
	https://github.com/whywilson/ESP-PN532BLE
	NTPClient
	Timezone
	ESP32Time
	bblanchon/ArduinoJson
	https://github.com/bmorcelli/rc-switch
	ESP8266Audio
	FFat
	earlephilhower/ESP8266SAM@^1.0.1
	mikalhart/TinyGPSPlus
	tinyu-zhao/FFT@^0.0.1
	h2zero/NimBLE-Arduino@^1.4.0
	nrf24/RF24 @ ^1.4.9
	Adafruit Si4713 Library@1.2.3
	Bodmer/JPEGDecoder
	https://github.com/bmorcelli/SmartRC-CC1101-Driver-Lib/
	ducktape=https://github.com/bmorcelli/duktape/releases/download/2.7.0-lite/duktape-2.7.0.zip
	paulstoffregen/OneWire@^2.3.8
	;https://github.com/eadmaster/rtl_433_ESP
	;jackjansen/esp32_idf5_https_server_compat
	tobozo/ESP32-PSRamFS
	;chegewara/EspTinyUSB
	bitbank2/AnimatedGIF
	https://github.com/bitbank2/PNGdec

monitor_speed = 115200

; ==========================================
; CONFIGURAÇÃO DA ESP32 WROOM + OLED 0.96
; ==========================================
[env:esp32-wroom-oled]
extends = env
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
	${env.build_flags}
	-D ESP32_WROOM
	-D USE_OLED_096
	-D TARGET_OLED
	; Configurações padrão de pinagem I2C para a tela OLED no ESP32 WROOM
	-D PIN_SDA=21
	-D PIN_SCL=22
	
	; === ADICIONE ESTAS LINHAS ABAIXO PARA CORRIGIR OS ERROS ===
	-D ROTATION=1
	-D LED=2             ; Pino do LED interno (na maioria das placas ESP32 é o pino 2. Use -1 se não tiver)
	-D GROVE_SDA=21      ; Aponta o recurso GROVE para o mesmo pino SDA do OLED
	-D GROVE_SCL=22      ; Aponta o recurso GROVE para o mesmo pino SCL do OLED
lib_deps =
	${env.lib_deps}
	adafruit/Adafruit SSD1306 @ ^2.5.13
	adafruit/Adafruit GFX Library @ ^1.11.11
	
